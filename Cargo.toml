[package]
name = "skopio-zed"
version.workspace = true
edition = "2024"

[lib]
crate-type = ["cdylib"]

[workspace]
members = ["skopio-ls"]

[workspace.package]
version = "0.1.0"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
zed_extension_api = "0.7.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.dist]
dist = false
